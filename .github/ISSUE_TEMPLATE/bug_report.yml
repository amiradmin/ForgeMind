name: Bug report
description: Report a reproducible problem in ForgeMind
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ForgeMind. Do not include credentials, proprietary plant data, or personal information.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Start...
        2. Call...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version, branch or commit, and relevant service versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or additional context
      description: Remove secrets and sensitive data before posting.

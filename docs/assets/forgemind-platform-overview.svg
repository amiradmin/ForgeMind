<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ForgeMind industrial intelligence platform overview</title>
  <desc id="desc">A visual overview showing the implemented asset, operations, and maintenance foundation flowing into the planned industrial intelligence layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1729"/>
      <stop offset="1" stop-color="#101d31"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="future" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#93c5fd" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 58px; font-weight: 800; letter-spacing: -1.8px; }
      .subtitle { font-size: 23px; font-weight: 400; }
      .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: 2.1px; }
      .card-title { font-size: 22px; font-weight: 750; }
      .item { font-size: 16px; font-weight: 500; }
      .small { font-size: 14px; font-weight: 550; }
      .metric { font-size: 17px; font-weight: 680; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="30" fill="url(#grid)"/>
  <circle cx="1430" cy="75" r="250" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="1320" cy="850" r="330" fill="#8b5cf6" opacity="0.07"/>

  <g class="font">
    <g transform="translate(86 62)">
      <g transform="translate(0 4)">
        <path d="M8 34 L28 0 L48 34 L28 68 Z" fill="none" stroke="url(#brand)" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="28" cy="34" r="8" fill="#22d3ee"/>
      </g>
      <text x="72" y="48" class="title" fill="#f8fafc">ForgeMind</text>
      <text x="75" y="84" class="subtitle" fill="#9fb2ca">Industrial context in. Reliable decisions out.</text>
    </g>

    <g transform="translate(1115 68)">
      <rect width="397" height="54" rx="27" fill="#10283a" stroke="#1f5065"/>
      <circle cx="29" cy="27" r="7" fill="#34d399"/>
      <text x="49" y="34" class="small" fill="#d8f9ee">OPEN SOURCE</text>
      <circle cx="170" cy="27" r="3" fill="#52728b"/>
      <text x="184" y="34" class="small" fill="#dce9f5">API-FIRST</text>
      <circle cx="275" cy="27" r="3" fill="#52728b"/>
      <text x="289" y="34" class="small" fill="#dce9f5">MODULAR</text>
    </g>

    <g transform="translate(86 190)">
      <rect width="1045" height="33" rx="16.5" fill="#0b3541"/>
      <circle cx="18" cy="16.5" r="6" fill="#34d399"/>
      <text x="34" y="22" class="eyebrow" fill="#82f2d0">IMPLEMENTED PLATFORM FOUNDATION</text>
      <line x1="332" y1="16.5" x2="1025" y2="16.5" stroke="#1b5360" stroke-width="1"/>
    </g>

    <g filter="url(#shadow)">
      <g transform="translate(86 242)">
        <rect width="326" height="360" rx="24" fill="#101f32" stroke="#24425d" stroke-width="1.5"/>
        <rect x="1" y="1" width="324" height="6" rx="3" fill="#22d3ee"/>
        <g transform="translate(28 28)">
          <rect width="48" height="48" rx="13" fill="#0b3541"/>
          <path d="M12 35 V21 L24 12 L36 21 V35 M19 35 V27 H29 V35" fill="none" stroke="#5ee7f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="64" y="31" class="card-title" fill="#f1f5f9">Asset context</text>
        </g>
        <text x="28" y="112" class="item" fill="#b7c7d9">Organization hierarchy</text>
        <text x="28" y="154" class="item" fill="#b7c7d9">Plants and operational areas</text>
        <text x="28" y="196" class="item" fill="#b7c7d9">Asset registry and types</text>
        <text x="28" y="238" class="item" fill="#b7c7d9">Criticality and metadata</text>
        <line x1="28" y1="276" x2="298" y2="276" stroke="#274059"/>
        <rect x="28" y="302" width="119" height="30" rx="15" fill="#10362f"/>
        <circle cx="46" cy="317" r="5" fill="#34d399"/>
        <text x="58" y="322" class="small" fill="#9df2d7">REST API</text>
        <rect x="157" y="302" width="141" height="30" rx="15" fill="#162b42"/>
        <text x="174" y="322" class="small" fill="#a9bfd5">RBAC + audit</text>
      </g>

      <g transform="translate(447 242)">
        <rect width="326" height="360" rx="24" fill="#101f32" stroke="#24425d" stroke-width="1.5"/>
        <rect x="1" y="1" width="324" height="6" rx="3" fill="#38bdf8"/>
        <g transform="translate(28 28)">
          <rect width="48" height="48" rx="13" fill="#102f4a"/>
          <path d="M10 27 H16 L21 15 L28 35 L33 23 H38" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="64" y="31" class="card-title" fill="#f1f5f9">Live operations</text>
        </g>
        <text x="28" y="112" class="item" fill="#b7c7d9">Telemetry records</text>
        <text x="28" y="154" class="item" fill="#b7c7d9">Industrial events</text>
        <text x="28" y="196" class="item" fill="#b7c7d9">Unified asset timeline</text>
        <text x="28" y="238" class="item" fill="#b7c7d9">Traceable operational history</text>
        <line x1="28" y1="276" x2="298" y2="276" stroke="#274059"/>
        <rect x="28" y="302" width="125" height="30" rx="15" fill="#102f4a"/>
        <text x="45" y="322" class="small" fill="#b4ddfa">PostgreSQL</text>
        <rect x="163" y="302" width="135" height="30" rx="15" fill="#102f4a"/>
        <text x="181" y="322" class="small" fill="#b4ddfa">Redis + Celery</text>
      </g>

      <g transform="translate(808 242)">
        <rect width="326" height="360" rx="24" fill="#101f32" stroke="#24425d" stroke-width="1.5"/>
        <rect x="1" y="1" width="324" height="6" rx="3" fill="#34d399"/>
        <g transform="translate(28 28)">
          <rect width="48" height="48" rx="13" fill="#10362f"/>
          <path d="M14 12 H34 V36 H14 Z M19 18 H29 M19 24 H29 M19 30 H26" fill="none" stroke="#6ee7b7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="64" y="31" class="card-title" fill="#f1f5f9">Maintenance</text>
        </g>
        <text x="28" y="112" class="item" fill="#b7c7d9">Maintenance requests</text>
        <text x="28" y="154" class="item" fill="#b7c7d9">Maintenance plans</text>
        <text x="28" y="196" class="item" fill="#b7c7d9">Work orders</text>
        <text x="28" y="238" class="item" fill="#b7c7d9">Service-layer workflows</text>
        <line x1="28" y1="276" x2="298" y2="276" stroke="#274059"/>
        <rect x="28" y="302" width="123" height="30" rx="15" fill="#10362f"/>
        <text x="46" y="322" class="small" fill="#9df2d7">Tested APIs</text>
        <rect x="161" y="302" width="137" height="30" rx="15" fill="#162b42"/>
        <text x="178" y="322" class="small" fill="#a9bfd5">OpenAPI docs</text>
      </g>
    </g>

    <path d="M412 422 H438" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M773 422 H799" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1134 422 H1168" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1170 190)">
      <rect width="342" height="33" rx="16.5" fill="#2c1d49"/>
      <circle cx="18" cy="16.5" r="6" fill="#c084fc"/>
      <text x="34" y="22" class="eyebrow" fill="#d8b4fe">INTELLIGENCE ROADMAP</text>
    </g>

    <g transform="translate(1170 242)" filter="url(#shadow)">
      <rect width="342" height="360" rx="24" fill="#171d35" stroke="#68449a" stroke-width="1.5" stroke-dasharray="8 7"/>
      <rect x="1" y="1" width="340" height="6" rx="3" fill="url(#future)"/>
      <g transform="translate(28 28)">
        <rect width="48" height="48" rx="13" fill="#312150"/>
        <circle cx="24" cy="24" r="12" fill="none" stroke="#d8b4fe" stroke-width="2.3"/>
        <path d="M24 8 V14 M24 34 V40 M8 24 H14 M34 24 H40 M13 13 L17 17 M31 31 L35 35 M35 13 L31 17 M17 31 L13 35" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round"/>
        <text x="64" y="31" class="card-title" fill="#f5f3ff">Industrial AI</text>
      </g>
      <text x="28" y="112" class="item" fill="#d0c6e1">Predictive maintenance</text>
      <text x="28" y="154" class="item" fill="#d0c6e1">Anomaly detection</text>
      <text x="28" y="196" class="item" fill="#d0c6e1">Computer vision</text>
      <text x="28" y="238" class="item" fill="#d0c6e1">Digital twin integration</text>
      <line x1="28" y1="276" x2="314" y2="276" stroke="#46345f"/>
      <rect x="28" y="302" width="176" height="30" rx="15" fill="#312150"/>
      <circle cx="46" cy="317" r="5" fill="#c084fc"/>
      <text x="58" y="322" class="small" fill="#e9d5ff">Planned capabilities</text>
    </g>

    <g transform="translate(86 650)">
      <text x="0" y="21" class="eyebrow" fill="#8096ad">ONE CONTEXTUAL DATA FLOW</text>
      <g transform="translate(0 42)">
        <rect width="1426" height="128" rx="24" fill="#0d1c2e" stroke="#223d56"/>
        <g transform="translate(35 29)">
          <rect width="245" height="70" rx="18" fill="#10283a"/>
          <text x="24" y="31" class="small" fill="#7593ad">INDUSTRIAL INPUT</text>
          <text x="24" y="55" class="metric" fill="#e4edf6">Assets + signals + events</text>
        </g>
        <path d="M300 64 H370" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
        <g transform="translate(390 29)">
          <rect width="285" height="70" rx="18" fill="#10283a"/>
          <text x="24" y="31" class="small" fill="#7593ad">DOMAIN CONTEXT</text>
          <text x="24" y="55" class="metric" fill="#e4edf6">Timeline + maintenance history</text>
        </g>
        <path d="M695 64 H765" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
        <g transform="translate(785 29)">
          <rect width="250" height="70" rx="18" fill="#241c3b"/>
          <text x="24" y="31" class="small" fill="#9f89bb">INTELLIGENCE</text>
          <text x="24" y="55" class="metric" fill="#eee7f8">Models with real context</text>
        </g>
        <path d="M1055 64 H1125" stroke="#a78bfa" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
        <g transform="translate(1145 29)">
          <rect width="246" height="70" rx="18" fill="#10362f"/>
          <text x="24" y="31" class="small" fill="#6eb8a1">TARGET OUTCOME</text>
          <text x="24" y="55" class="metric" fill="#dcfaef">Earlier, safer decisions</text>
        </g>
      </g>
    </g>

    <g transform="translate(86 853)">
      <circle cx="6" cy="-5" r="5" fill="#34d399"/>
      <text x="19" y="0" class="small" fill="#8da4ba">Solid cards: available foundation</text>
      <line x1="276" y1="-5" x2="308" y2="-5" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="320" y="0" class="small" fill="#8da4ba">Dashed card: planned intelligence</text>
      <text x="1426" y="0" text-anchor="end" class="small" fill="#5f7a92">github.com/amiradmin/ForgeMind</text>
    </g>
  </g>
</svg>
